name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify production
        run: npm run verify:prod

      - name: Audit production dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Set build timestamp
        shell: pwsh
        run: |
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          "BUILD_TIMESTAMP=$stamp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows setup
        run: npm run package:setup:built

      - name: Preserve setup artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-setup | Out-Null
          Copy-Item -Path release/* -Destination release-setup -Recurse -Force

      - name: Build Windows portable
        run: npm run package:portable:built

      - name: Merge setup and portable artifacts
        shell: pwsh
        run: |
          Copy-Item -Path release-setup/* -Destination release -Recurse -Force

      - name: Generate CycloneDX SBOM
        run: npm run release:sbom

      - name: Generate SHA256 checksums
        run: npm run release:checksums -- --require-artifact

      - name: Smoke test packaged portable artifact
        run: npm run release:smoke -- --require-artifact --stable-ms 15000

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/sbom.cdx.json
            release/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepchat-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/sbom.cdx.json
            release/SHA256SUMS.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/sbom.cdx.json
            release/SHA256SUMS.txt
