name: Bug report
description: Report a reproducible DeepChat problem.
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include provider, model, tool mode, and whether MCP/workspace tools were enabled.
      placeholder: |
        1. Open...
        2. Send...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove API keys, local secrets, and private file contents before uploading.
